name: Desktop builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macOS-arm64
          - os: windows-2025
            name: Windows-x64
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt -e ".[desktop,eis,cycling,biologic,export,dev,build]"
      - name: Check isolation, numerical baselines and Qt heartbeat
        run: python -m pytest -q tests/test_isolation.py tests/test_science.py tests/test_cycling.py tests/test_qt.py::test_qt_heartbeat_survives_cpu_bound_job_and_crash
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }
      - name: Build and test standalone application
        run: python tools/build_desktop.py
      - name: Upload verified applications and source
        uses: actions/upload-artifact@v7
        with:
          name: ChemSuite-${{ matrix.name }}
          path: build/desktop/release/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.name }}
          path: |
            build/desktop/release/*.json
            build/desktop/work/**/warn-*.txt
          if-no-files-found: ignore
